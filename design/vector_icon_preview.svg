<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Background Frosted Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#E5ECF6" />
    </linearGradient>
    
    <!-- Head & Wings Blue Gradient -->
    <linearGradient id="blueGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" />
      <stop offset="45%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <!-- Arrow Gradient (Violet to Cyan) -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="50%" stop-color="#448AFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="108" height="108" rx="26" fill="url(#bgGrad)" />

  <!-- Subtle ambient glow under the wings/arrow -->
  <path d="M30,62 L54,52 L78,62 L65,74 L54,65 L43,74 Z" fill="#40C4FF" opacity="0.25" filter="url(#glow)" />

  <!-- Antennae -->
  <path d="M47,38.5 L43.5,31.5" stroke="#38B6FF" stroke-width="2.6" stroke-linecap="round" />
  <path d="M61,38.5 L64.5,31.5" stroke="#38B6FF" stroke-width="2.6" stroke-linecap="round" />

  <!-- Android Head Dome -->
  <path d="M41,45.5 C41,38.5 46.8,35 54,35 C61.2,35 67,38.5 67,45.5 C67,46.2 66.2,46.5 65.2,46.5 L42.8,46.5 C41.8,46.5 41,46.2 41,45.5 Z" fill="url(#blueGrad)" />

  <!-- Eyes -->
  <circle cx="47.5" cy="42" r="1.4" fill="#FFFFFF" opacity="0.95" />
  <circle cx="60.5" cy="42" r="1.4" fill="#FFFFFF" opacity="0.95" />

  <!-- Rocket Wings / Body -->
  <path d="M42.8,48.5 L65.2,48.5 C66.2,48.5 66.9,49.2 67.2,50.2 C69.5,57.5 73.8,61.5 78.5,62.8 C79.2,63 79.2,63.9 78.6,64.2 L71.5,65.8 C70.8,66 70.2,65.6 69.8,65 L66.5,58.5 C66.2,57.8 65.5,57.5 64.8,57.8 L54,62.5 L43.2,57.8 C42.5,57.5 41.8,57.8 41.5,58.5 L38.2,65 C37.8,65.6 37.2,66 36.5,65.8 L29.4,64.2 C28.8,63.9 28.8,63 29.5,62.8 C34.2,61.5 38.5,57.5 40.8,50.2 C41.1,49.2 41.8,48.5 42.8,48.5 Z" fill="url(#blueGrad)" />

  <!-- Ascending Chevron Arrow -->
  <path d="M54,56.5 C54.5,56.5 55,56.8 55.4,57.2 L66.5,68.8 C67.1,69.5 66.8,70.5 66,70.9 L63.5,72.2 C62.7,72.6 61.8,72.3 61.3,71.7 L54,64 L46.7,71.7 C46.2,72.3 45.3,72.6 44.5,72.2 L42,70.9 C41.2,70.5 40.9,69.5 41.5,68.8 L52.6,57.2 C53,56.8 53.5,56.5 54,56.5 Z" fill="url(#arrowGrad)" />
</svg>
