<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0F17" />
      <stop offset="45%" stop-color="#121727" />
      <stop offset="100%" stop-color="#182238" />
    </linearGradient>

    <!-- Rainbow Neon Glow Gradient -->
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="25%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Capsule Shadow -->
    <filter id="capsuleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#A855F7" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font-base {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Outer Card -->
  <rect x="0" y="0" width="1200" height="360" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="1" />

  <!-- Ambient Glow Circles -->
  <circle cx="1020" cy="80" r="140" fill="url(#purpleGlow)" />
  <circle cx="180" cy="300" r="150" fill="url(#blueGlow)" />
  <circle cx="560" cy="180" r="120" fill="url(#emeraldGlow)" />

  <!-- Top Bar: Brand Pill -->
  <g transform="translate(42, 30)">
    <rect x="0" y="0" width="258" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <!-- Android / ApkUp Robot Icon -->
    <rect x="10" y="7" width="22" height="22" rx="5" fill="#3B82F6" />
    <path d="M16 14 L26 14 M21 9 L21 19 M17 11 L25 17" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="40" y="23" class="font-base" font-size="13.5" font-weight="700" fill="#F8FAFC">ApkUp <tspan font-weight="600" fill="#94A3B8">• Feature Update v1.41.2</tspan></text>
  </g>

  <!-- Top Bar: Badge Tag -->
  <g transform="translate(976, 30)">
    <rect x="0" y="0" width="182" height="32" rx="8" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1" />
    <text x="91" y="21" class="font-base" font-size="11.5" font-weight="800" fill="#1E40AF" letter-spacing="0.5" text-anchor="middle">+ SHIZUKU AUTO-INSTALL</text>
  </g>

  <!-- Center Capsule -->
  <g transform="translate(335, 140)" filter="url(#capsuleGlow)">
    <!-- Rainbow Outer Stroke -->
    <rect x="0" y="0" width="530" height="66" rx="33" fill="none" stroke="url(#rainbowBorder)" stroke-width="2.5" />
    <!-- Inner Dark Capsule -->
    <rect x="1.5" y="1.5" width="527" height="63" rx="31.5" fill="#141721" />

    <!-- Icon Circle -->
    <g transform="translate(18, 13)">
      <circle cx="20" cy="20" r="20" fill="rgba(168, 85, 247, 0.22)" stroke="rgba(216, 180, 254, 0.35)" stroke-width="1" />
      <path d="M13 11 H27 V13 H13 V11 Z M13 15 H27 V17 H13 V15 Z M13 19 H23 V21 H13 V19 Z M27 8 H13 C11.9 8 11 8.9 11 10 V22 C11 23.1 11.9 24 13 24 H27 C28.1 24 29 23.1 29 22 V10 C29 8.9 28.1 8 27 8 Z M27 22 H13 V10 H27 V22 Z" fill="#D8B4FE" />
    </g>

    <!-- Feature Headline -->
    <text x="76" y="42" class="font-base" font-size="26" font-weight="700" fill="#F8FAFC" letter-spacing="-0.3">Autonomous Background Updates</text>
  </g>

  <!-- Bottom Feature Badges -->
  <g transform="translate(0, 280)">
    <!-- Silent Shizuku Installs -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="180" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
      <path d="M16 11 L10 19 H15 L14 25 L20 17 H15 L16 11 Z" fill="#C084FC" />
      <text x="36" y="22" class="font-base" font-size="13" font-weight="600" fill="#CBD5E1">Silent Shizuku Installs</text>
    </g>

    <!-- Wi-Fi & Charging Guard -->
    <g transform="translate(421, 0)">
      <rect x="0" y="0" width="194" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
      <path d="M15 15 C17.2 13 20.8 13 23 15 M13 12 C16.3 9.5 21.7 9.5 25 12 M19 18 A1.5 1.5 0 1 1 18.99 18" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none" />
      <text x="36" y="22" class="font-base" font-size="13" font-weight="600" fill="#CBD5E1">Wi-Fi &amp; Charging Guard</text>
    </g>

    <!-- Full Update History -->
    <g transform="translate(631, 0)">
      <rect x="0" y="0" width="168" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
      <path d="M19 11 V17 L23 19.5 M19 9 C14.6 9 11 12.6 11 17 C11 21.4 14.6 25 19 25 C23.4 25 27 21.4 27 17 C27 12.6 23.4 9 19 9 Z" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <text x="36" y="22" class="font-base" font-size="13" font-weight="600" fill="#CBD5E1">Full Update History</text>
    </g>

    <!-- APKMirror Bypass -->
    <g transform="translate(815, 0)">
      <rect x="0" y="0" width="160" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
      <path d="M14 11 L19 9 L24 11 V16 C24 19.5 21.9 22.7 19 23.5 C16.1 22.7 14 19.5 14 16 V11 Z M17 16 L18.5 17.5 L21.5 14.5" fill="#FBBF24" stroke="#FBBF24" stroke-width="1" />
      <text x="36" y="22" class="font-base" font-size="13" font-weight="600" fill="#CBD5E1">APKMirror Bypass</text>
    </g>
  </g>
</svg>
