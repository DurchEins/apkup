<svg viewBox="0 0 460 116" width="460" height="116" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ApkUp Live Update Card: 1.45.0 to 1.45.1 Verified">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate { display: none; }
    }
    .app-name { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #1C1917; }
    .ver-old { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #78716C; }
    .ver-new { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #B45309; }
    .meta { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #44403C; }
    .btn-txt { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
    <linearGradient id="cardBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#FAF6EE" />
    </linearGradient>
    <linearGradient id="btnShimmerL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
      <animate attributeName="x1" values="-100%;100%" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3.2s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="458" height="114" rx="20" fill="url(#cardBgL)" stroke="#E7E0D3" stroke-width="1.2" />

  <!-- App Icon Box -->
  <rect x="18" y="26" width="54" height="54" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-opacity="0.35" stroke-width="1" />
  <path d="M35 55 L45 45 L55 55 M45 45 L45 64" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="34" y="38" width="22" height="3" rx="1.5" fill="#D97706" />

  <!-- Text & Badges -->
  <text x="86" y="42" class="app-name">ApkUp</text>
  <text x="86" y="61" class="ver-old">v1.45.0  ➔</text>
  <text x="160" y="61" class="ver-new">v1.45.1 (223)</text>

  <!-- Source & Verified Pill -->
  <rect x="86" y="72" width="142" height="22" rx="7" fill="#F3ECE0" />
  <circle cx="98" cy="83" r="3.5" fill="#16A34A">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="108" y="87" class="meta">GitHub • Verified ✓</text>

  <!-- Get update CTA Button -->
  <rect x="314" y="37" width="126" height="42" rx="14" fill="#D97706" />
  <rect x="314" y="37" width="126" height="42" rx="14" fill="url(#btnShimmerL)" opacity="0.65" />
  <text x="377" y="62.5" text-anchor="middle" class="btn-txt">Get update</text>
</svg>
