name: Feature Request
description: Suggest a new feature, update source, or UI improvement
title: "[Feature Request] "
type: Feature
assignees:
  - DurchEins
labels:
  - enhancement
  - needs-triage
body:
  - type: dropdown
    id: area
    attributes:
      label: Category
      multiple: true
      options:
        - Update Sources & Repository Linking
        - Background Updates / Shizuku / Root
        - Rollback / Export / Backup
        - Watchlist & Obtainium Sync
        - UI / Material 3 Design / Accessibility
        - Other
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement clearly.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Why would this be useful? (optional)
      description: Explain the problem it solves or how you would use it in your workflow.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked existing issues and confirmed this feature does not already exist.
          required: true
