name: Feature Request
description: Suggest a new feature, update source, or improvement
type: Feature
labels:
  - enhancement
  - needs-triage
body:
  - type: dropdown
    id: area
    attributes:
      label: Category
      multiple: true
      options:
        - Update Sources
        - Background Updates / Shizuku / Root
        - Rollback / Export / Backup
        - UI / Design / Accessibility
        - Other
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement clearly.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Why would this be useful? (optional)
      description: Explain the problem it solves or how you would use it.
    validations:
      required: false
