name: Sync Website (docs/)

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'app/src/main/assets/changelog/**'
      - 'SECURITY.md'
      - 'PRIVACY.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies & build docs/
        working-directory: website
        run: |
          npm ci
          npm run build
          rm -f ../docs/*.mjs

      - name: Commit updated docs/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(website): auto-sync docs/ build"
            git push
          fi
