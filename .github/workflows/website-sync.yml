name: Sync Website (docs/)

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'app/src/main/assets/changelog/**'
      - 'SECURITY.md'
      - 'PRIVACY.md'
  release:
    types: [published]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Sync GitHub Wiki markdown
        run: |
          git clone --depth=1 https://github.com/DurchEins/apkup.wiki.git /tmp/apkup-wiki || true
          if [ -d /tmp/apkup-wiki ]; then
            cp -f /tmp/apkup-wiki/*.md website/src/data/wiki/ 2>/dev/null || true
            rm -rf /tmp/apkup-wiki
          fi

      - name: Generate GitBook docs & update Sponsors SVG/Wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node website/scripts/generate-gitbook.mjs
          node website/scripts/update-sponsors-svg.mjs
          node website/scripts/update-sponsors-wall.mjs

      - name: Install dependencies & build docs/
        working-directory: website
        run: |
          npm ci
          npm run build
          rm -f ../docs/*.mjs

      - name: Commit updated docs/ if changed
        run: |
          git config user.name "DurchEins"
          git config user.email "DurchEins@users.noreply.github.com"
          git add docs/ website/src/data/wiki/ website/public/ gitbook/ .github/assets/github-sponsors-button.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(website): auto-sync wiki & docs/ build"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
