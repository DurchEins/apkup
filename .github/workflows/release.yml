name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional Git tag to publish as a GitHub Release (leave empty to build artifact only)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release (keep false for regular manual/Beta-named full releases)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stage Release Keystore (Fail-Closed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Refusing to build debug-signed release APK."
            exit 1
          fi
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Run Lint, Unit Tests and Assemble Signed Release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease testDebugUnitTest assembleRelease --stacktrace

      - name: Shred Staged Keystore
        if: always()
        run: |
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          if [ -f "$KS_PATH" ]; then
            shred -u "$KS_PATH" 2>/dev/null || rm -f "$KS_PATH"
          fi

      - name: Verify APK Signature & Prepare Release Assets
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          mkdir -p release_assets
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Expected signed APK not found at $APK_FILE"
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose "$APK_FILE"
          fi

          RAW_LABEL="${INPUT_TAG:-run-${GITHUB_RUN_NUMBER}}"
          SAFE_LABEL=$(printf '%s' "$RAW_LABEL" | tr -cd 'A-Za-z0-9._-')
          TARGET_APK="release_assets/ApkUp-${SAFE_LABEL}.apk"
          cp "$APK_FILE" "$TARGET_APK"
          (cd release_assets && sha256sum "$(basename "$TARGET_APK")" > "$(basename "$TARGET_APK").sha256")

          CHANGELOG_FILE=$(ls -v fastlane/metadata/android/en-US/changelogs/*.txt 2>/dev/null | tail -n 1)
          if [ -n "$CHANGELOG_FILE" ] && [ -f "$CHANGELOG_FILE" ]; then
            cp "$CHANGELOG_FILE" release_assets/RELEASE_NOTES.md
          else
            printf 'ApkUp Release %s\n' "$SAFE_LABEL" > release_assets/RELEASE_NOTES.md
          fi

      - name: Upload Release Assets Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apkup-release-assets
          path: release_assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Release Assets Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apkup-release-assets
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ inputs.tag_name }}
          body_path: release_assets/RELEASE_NOTES.md
          files: |
            release_assets/*.apk
            release_assets/*.apk.sha256
          draft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Mirror Release to GitLab (Optional)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN not set; skipping GitLab release mirror."
            exit 0
          fi

          PROJECT_ID="DurchEins1%2Fapkup"
          SAFE_TAG=$(printf '%s' "$INPUT_TAG" | tr -cd 'A-Za-z0-9._-')
          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          SHA_PATH=$(find release_assets -maxdepth 1 -name '*.apk.sha256' | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          SHA_NAME=$(basename "$SHA_PATH")

          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/DurchEins1/apkup.git" "${GITHUB_SHA}:refs/tags/${SAFE_TAG}" || true

          PKG_BASE="https://gitlab.com/api/v4/projects/${PROJECT_ID}/packages/generic/apkup/${SAFE_TAG}"
          curl -fsSL -X PUT -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "$APK_PATH" "${PKG_BASE}/${APK_NAME}" > /dev/null
          curl -fsSL -X PUT -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "$SHA_PATH" "${PKG_BASE}/${SHA_NAME}" > /dev/null

          PAYLOAD=$(jq -n \
            --arg tag "$SAFE_TAG" \
            --arg name "$SAFE_TAG" \
            --rawfile desc release_assets/RELEASE_NOTES.md \
            --arg apk_name "$APK_NAME" \
            --arg apk_url "${PKG_BASE}/${APK_NAME}" \
            --arg sha_name "$SHA_NAME" \
            --arg sha_url "${PKG_BASE}/${SHA_NAME}" \
            '{
              tag_name: $tag,
              name: $name,
              description: $desc,
              assets: {
                links: [
                  { name: $apk_name, url: $apk_url, link_type: "package" },
                  { name: $sha_name, url: $sha_url, link_type: "other" }
                ]
              }
            }')

          curl -fsSL -X POST \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://gitlab.com/api/v4/projects/${PROJECT_ID}/releases" > /dev/null

      - name: Publish to Zapstore (Optional)
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "ZAPSTORE_SIGN_WITH not set; skipping Zapstore publish."
            exit 0
          fi
          go install github.com/zapstore/zsp/v2/cmd/zsp@latest
          "$(go env GOPATH)/bin/zsp" publish zapstore.yaml
