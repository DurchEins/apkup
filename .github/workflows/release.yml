name: Build & Publish Release
run-name: "Release ${{ inputs.tag_name != '' && inputs.tag_name || 'Artifact-Build' }}"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional Git tag to publish as a GitHub Release (leave empty to build artifact only)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release (keep false for regular stable releases)'
        required: false
        default: false
        type: boolean
      itch_channel:
        description: 'itch.io Butler channel (android for stable, android-beta for pre-releases)'
        required: false
        default: 'android'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stage Release Keystore (Fail-Closed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Refusing to build debug-signed release APK."
            exit 1
          fi
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Run Lint, Unit Tests and Assemble Signed Release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease testDebugUnitTest assembleRelease --stacktrace

      - name: Shred Staged Keystore
        if: always()
        run: |
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          if [ -f "$KS_PATH" ]; then
            shred -u "$KS_PATH" 2>/dev/null || rm -f "$KS_PATH"
          fi

      - name: Verify APK Signature & Prepare Release Assets
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          mkdir -p release_assets
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Expected signed APK not found at $APK_FILE"
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose "$APK_FILE"
          fi

          RAW_LABEL="${INPUT_TAG:-run-${GITHUB_RUN_NUMBER}}"
          SAFE_LABEL=$(printf '%s' "$RAW_LABEL" | tr -cd 'A-Za-z0-9._-')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | tail -n 1 || true)
          if [ -n "$VERSION_CODE" ] && [ -n "$INPUT_TAG" ]; then
            APK_FILENAME="ApkUp-${SAFE_LABEL}-${VERSION_CODE}.apk"
          else
            APK_FILENAME="ApkUp-${SAFE_LABEL}.apk"
          fi
          TARGET_APK="release_assets/${APK_FILENAME}"
          cp "$APK_FILE" "$TARGET_APK"
          (cd release_assets && sha256sum "$(basename "$TARGET_APK")" > "$(basename "$TARGET_APK").sha256")
          APK_SHA256=$(awk '{print $1}' "${TARGET_APK}.sha256")

          CHANGELOG_FILE=$(ls -v fastlane/metadata/android/en-US/changelogs/*.txt 2>/dev/null | tail -n 1)
          if [ -n "$CHANGELOG_FILE" ] && [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG_BODY=$(cat "$CHANGELOG_FILE")
          else
            CHANGELOG_BODY="ApkUp Release ${SAFE_LABEL}"
          fi

          CLEAN_VER="${SAFE_LABEL#v}"
          BADGE_LABEL="Feature_Update"
          BADGE_COLOR="A855F7"
          if printf '%s' "$CLEAN_VER" | grep -qE '^[0-9]+\.[0-9]+\.[1-9][0-9]*'; then
            BADGE_LABEL="Patch_%26_Fix"
            BADGE_COLOR="38BDF8"
          elif printf '%s' "$CLEAN_VER" | grep -qE '^[0-9]+\.0\.0'; then
            BADGE_LABEL="Major_Update"
            BADGE_COLOR="F59E0B"
          fi

          cat <<EOF > release_assets/RELEASE_NOTES.md
          <div align="center">

          ## What's new in ${SAFE_LABEL}${VERSION_CODE:+ (Build ${VERSION_CODE})}
          ![](https://img.shields.io/badge/Release-${BADGE_LABEL}-${BADGE_COLOR}?style=flat&labelColor=161B22) ${VERSION_CODE:+![](https://img.shields.io/badge/Build-${VERSION_CODE}-38BDF8?style=flat&labelColor=161B22)} [![VirusTotal](https://img.shields.io/badge/VirusTotal-Check_Report-22C55E?style=flat&logo=virustotal&logoColor=white&labelColor=161B22)](https://www.virustotal.com/gui/file/${APK_SHA256}/detection)

          </div>

          ${CHANGELOG_BODY}

          ---

          > [!TIP]
          > ### 🎉 Available Across Independent Platforms
          > Download and update ApkUp via **GitHub**, **Zapstore**, **GitLab**, **APKPure**, **itch.io**, and **Appteka**:
          >
          > <a href="https://zapstore.dev/apps/com.apkup"><img src="https://img.shields.io/badge/Zapstore-Available-7C3AED?style=flat&logo=lightning&logoColor=white" alt="Zapstore" /></a>&nbsp;&nbsp;<a href="https://gitlab.com/DurchEins1/apkup/-/releases"><img src="https://img.shields.io/badge/GitLab-Releases-FC6D26?style=flat&logo=gitlab&logoColor=white" alt="GitLab Releases" /></a>&nbsp;&nbsp;<a href="https://apkpure.com/apkup/com.apkup"><img src="https://img.shields.io/badge/APKPure-Available-24C270?style=flat&logo=android&logoColor=white" alt="APKPure" /></a>&nbsp;&nbsp;<a href="https://durcheins.itch.io/apkup"><img src="https://img.shields.io/badge/itch.io-Available-FA5C5C?style=flat&logo=itchdotio&logoColor=white" alt="itch.io" /></a>&nbsp;&nbsp;<a href="https://appteka.store/app/c0cr341070"><img src="https://img.shields.io/badge/Appteka-Available-0EA5E9?style=flat&logo=android&logoColor=white" alt="Appteka" /></a>

          ---

          ### 💬 Feedback, Bugs & Ideas
          Found a bug, have an idea, or encountered an issue? Please don't hesitate to open an **[Issue](https://github.com/DurchEins/apkup/issues)** on GitHub or share your feedback so we can make ApkUp even better!

          ---

          <details>
          <summary><b>📦 Installation & In-App Update Instructions</b></summary>
          <br>

          Download the attached **_[${APK_FILENAME}](https://github.com/DurchEins/apkup/releases/download/${SAFE_LABEL}/${APK_FILENAME})_** below or update directly via the in-app updater (<kbd>Setup</kbd> ➔ <kbd>About</kbd> ➔ <kbd>Check for updates</kbd>).

          - **Alternative Mirrors:** [Zapstore](https://zapstore.dev/apps/com.apkup) · [GitLab Releases](https://gitlab.com/DurchEins1/apkup/-/releases) · [APKPure](https://apkpure.com/apkup/com.apkup) · [itch.io](https://durcheins.itch.io/apkup) · [Appteka](https://appteka.store/app/c0cr341070)
          - **SHA-256 Checksum:** \`${APK_SHA256}\`
          - **Certificate SHA-256:** \`8e9b512371ee965afc7cc91f23490d3a514623b90d483e638bba8a070a2170b4\`

          </details>
          EOF
          sed -i 's/^          //' release_assets/RELEASE_NOTES.md

      - name: Upload Release Assets Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apkup-release-assets
          path: release_assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Release Assets Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apkup-release-assets
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ inputs.tag_name }}
          body_path: release_assets/RELEASE_NOTES.md
          files: |
            release_assets/*.apk
            release_assets/*.apk.sha256
          draft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Mirror Release to GitLab (Optional)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN not set; skipping GitLab release mirror."
            exit 0
          fi

          PROJECT_ID="DurchEins1%2Fapkup"
          SAFE_TAG=$(printf '%s' "$INPUT_TAG" | tr -cd 'A-Za-z0-9._-')
          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          SHA_PATH=$(find release_assets -maxdepth 1 -name '*.apk.sha256' | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          SHA_NAME=$(basename "$SHA_PATH")

          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/DurchEins1/apkup.git" "${GITHUB_SHA}:refs/tags/${SAFE_TAG}" || true

          PKG_BASE="https://gitlab.com/api/v4/projects/${PROJECT_ID}/packages/generic/apkup/${SAFE_TAG}"
          curl -fsSL -X PUT -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "$APK_PATH" "${PKG_BASE}/${APK_NAME}" > /dev/null
          curl -fsSL -X PUT -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "$SHA_PATH" "${PKG_BASE}/${SHA_NAME}" > /dev/null

          PAYLOAD=$(jq -n \
            --arg tag "$SAFE_TAG" \
            --arg name "$SAFE_TAG" \
            --rawfile desc release_assets/RELEASE_NOTES.md \
            --arg apk_name "$APK_NAME" \
            --arg apk_url "${PKG_BASE}/${APK_NAME}" \
            --arg sha_name "$SHA_NAME" \
            --arg sha_url "${PKG_BASE}/${SHA_NAME}" \
            '{
              tag_name: $tag,
              name: $name,
              description: $desc,
              assets: {
                links: [
                  { name: $apk_name, url: $apk_url, link_type: "package" },
                  { name: $sha_name, url: $sha_url, link_type: "other" }
                ]
              }
            }')

          curl -fsSL -X POST \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://gitlab.com/api/v4/projects/${PROJECT_ID}/releases" > /dev/null

      - name: Submit APK to VirusTotal (Optional)
        continue-on-error: true
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "VIRUSTOTAL_API_KEY not set; skipping VirusTotal upload."
            exit 0
          fi

          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::warning::Expected APK not found in release_assets/; skipping VirusTotal upload."
            exit 0
          fi

          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
            "https://www.virustotal.com/api/v3/files/${APK_SHA256}")

          if [ "$STATUS_CODE" = "200" ]; then
            echo "VirusTotal already has a record for ${APK_SHA256}."
          elif [ "$STATUS_CODE" = "404" ]; then
            FILE_SIZE=$(stat -c%s "$APK_PATH")
            UPLOAD_URL="https://www.virustotal.com/api/v3/files"
            if [ "$FILE_SIZE" -gt 33554432 ]; then
              UPLOAD_URL=$(curl -fsSL \
                -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
                "https://www.virustotal.com/api/v3/files/upload_url" | jq -r '.data')
            fi
            curl -fsSL -X POST \
              -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
              -F "file=@${APK_PATH}" \
              "$UPLOAD_URL" > /dev/null
            echo "Submitted APK to VirusTotal for scanning."
          else
            echo "::warning::Unexpected VirusTotal lookup status (${STATUS_CODE}); skipping upload."
          fi

          echo "VirusTotal report: https://www.virustotal.com/gui/file/${APK_SHA256}/detection"

      - name: Publish to Zapstore (Optional)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "ZAPSTORE_SIGN_WITH not set; skipping Zapstore publish."
            exit 0
          fi
          go install github.com/zapstore/zsp/v2/cmd/zsp@latest
          "$(go env GOPATH)/bin/zsp" publish -q zapstore.yaml

      - name: Publish to itch.io (Optional)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_CHANNEL: ${{ inputs.itch_channel }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY not set; skipping itch.io publish."
            exit 0
          fi

          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found in release_assets/"
            exit 1
          fi

          SAFE_VERSION=$(printf '%s' "$INPUT_TAG" | tr -cd 'A-Za-z0-9._-')
          SAFE_VERSION="${SAFE_VERSION#v}"
          RAW_CHANNEL="${INPUT_CHANNEL:-android}"
          SAFE_CHANNEL=$(printf '%s' "$RAW_CHANNEL" | tr -cd 'a-z0-9-')
          SAFE_CHANNEL="${SAFE_CHANNEL:-android}"

          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -q butler.zip -d "${RUNNER_TEMP}/butler_bin"
          chmod +x "${RUNNER_TEMP}/butler_bin/butler"
          "${RUNNER_TEMP}/butler_bin/butler" push "$APK_PATH" "durcheins/apkup:${SAFE_CHANNEL}" --userversion "$SAFE_VERSION"
          rm -f butler.zip
