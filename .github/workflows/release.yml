4156m7O3zlBbPA%2B4FHlWC1X%2BnQuGfrtNnMFV2Ui2vqfK0MEB4QwUNH09ZnsbO03%2BYxD2Kh74Kiwgn5FOv7siCN4XM2Hye8vkF%2FixXOUvVpbj2iAFwVfqQkTGjLQNUn9RAtUHpvUS%2B73P6iIZ%2FEte%2FxswCnmhJgJK4q1%2F1wKaGMGrhhi759%2BTWlgJnxbmjElKLTB1WKWmK0eKohnuIxa4OE%2BL4doERX82pqKioqKjYPvAfwsicZeOJHu4AAAAASUVORK5CYII%3D" alt="Available on Komi Store" /></a>
          - **VirusTotal Check:** [Click here.](https://www.virustotal.com/gui/file/${APK_SHA256}/detection)
          - **SHA-256 Checksum:** \`${APK_SHA256}\`
          - **Certificate SHA-256:** \`8e9b512371ee965afc7cc91f23490d3a514623b90d483e638bba8a070a2170b4\`

          </details>
          EOF
          sed -i 's/^          //' release_assets/RELEASE_NOTES.md

      - name: Upload Release Assets Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apkup-release-assets
          path: release_assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Release Assets Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apkup-release-assets
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ inputs.tag_name }}
          body_path: release_assets/RELEASE_NOTES.md
          files: |
            release_assets/*.apk
            release_assets/*.apk.sha256
          draft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Mirror Release to GitLab (Optional)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN not set; skipping GitLab release mirror."
            exit 0
          fi

          PROJECT_ID="DurchEins1%2Fapkup"
          SAFE_TAG=$(printf '%s' "$INPUT_TAG" | tr -cd 'A-Za-z0-9._-')
          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          SHA_PATH=$(find release_assets -maxdepth 1 -name '*.apk.sha256' | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          SHA_NAME=$(basename "$SHA_PATH")

          AUTH_HEADER="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          git -c "http.https://gitlab.com/.extraHeader=${AUTH_HEADER}" push "https://gitlab.com/DurchEins1/apkup.git" "${GITHUB_SHA}:refs/tags/${SAFE_TAG}" || echo "::warning::GitLab tag push skipped or already exists."

          PKG_BASE="https://gitlab.com/api/v4/projects/${PROJECT_ID}/packages/generic/apkup/${SAFE_TAG}"
          curl -fsSL -X PUT -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "$APK_PATH" "${PKG_BASE}/${APK_NAME}" > /dev/null
          curl -fsSL -X PUT -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "$SHA_PATH" "${PKG_BASE}/${SHA_NAME}" > /dev/null

          PAYLOAD=$(jq -n \
            --arg tag "$SAFE_TAG" \
            --arg name "$SAFE_TAG" \
            --rawfile desc release_assets/RELEASE_NOTES.md \
            --arg apk_name "$APK_NAME" \
            --arg apk_url "${PKG_BASE}/${APK_NAME}" \
            --arg sha_name "$SHA_NAME" \
            --arg sha_url "${PKG_BASE}/${SHA_NAME}" \
            '{
              tag_name: $tag,
              name: $name,
              description: $desc,
              assets: {
                links: [
                  { name: $apk_name, url: $apk_url, link_type: "package" },
                  { name: $sha_name, url: $sha_url, link_type: "other" }
                ]
              }
            }')

          curl -fsSL -X POST \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://gitlab.com/api/v4/projects/${PROJECT_ID}/releases" > /dev/null

      - name: Submit APK to VirusTotal (Optional)
        continue-on-error: true
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "VIRUSTOTAL_API_KEY not set; skipping VirusTotal upload."
            exit 0
          fi

          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::warning::Expected APK not found in release_assets/; skipping VirusTotal upload."
            exit 0
          fi

          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
            "https://www.virustotal.com/api/v3/files/${APK_SHA256}")

          if [ "$STATUS_CODE" = "200" ]; then
            echo "VirusTotal already has a record for ${APK_SHA256}."
          elif [ "$STATUS_CODE" = "404" ]; then
            FILE_SIZE=$(stat -c%s "$APK_PATH")
            UPLOAD_URL="https://www.virustotal.com/api/v3/files"
            if [ "$FILE_SIZE" -gt 33554432 ]; then
              UPLOAD_URL=$(curl -fsSL \
                -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
                "https://www.virustotal.com/api/v3/files/upload_url" | jq -r '.data')
            fi
            curl -fsSL -X POST \
              -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
              -F "file=@${APK_PATH}" \
              "$UPLOAD_URL" > /dev/null
            echo "Submitted APK to VirusTotal for scanning."
          else
            echo "::warning::Unexpected VirusTotal lookup status (${STATUS_CODE}); skipping upload."
          fi

          echo "VirusTotal report: https://www.virustotal.com/gui/file/${APK_SHA256}/detection"

      - name: Publish to Zapstore (Optional)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          ZAPSTORE_BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "ZAPSTORE_SIGN_WITH not set; skipping Zapstore publish."
            exit 0
          fi
          if [ -n "$ZAPSTORE_BUNKER_CLIENT_KEY" ]; then
            mkdir -p ~/.config/zsp/bunker-keys
            chmod 700 ~/.config/zsp ~/.config/zsp/bunker-keys
            printf '%s' "$ZAPSTORE_BUNKER_CLIENT_KEY" > ~/.config/zsp/bunker-keys/977120758bacb32947cf7df4345630ad9f1a57e6802afb6f6311aaf845c64c6d.key
            chmod 600 ~/.config/zsp/bunker-keys/977120758bacb32947cf7df4345630ad9f1a57e6802afb6f6311aaf845c64c6d.key
          fi
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          "$(go env GOPATH)/bin/zsp" publish -q zapstore.yaml

      - name: Publish to itch.io (Optional)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_CHANNEL: ${{ inputs.itch_channel }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY not set; skipping itch.io publish."
            exit 0
          fi

          APK_PATH=$(find release_assets -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found in release_assets/"
            exit 1
          fi

          SAFE_VERSION=$(printf '%s' "$INPUT_TAG" | tr -cd 'A-Za-z0-9._-')
          SAFE_VERSION="${SAFE_VERSION#v}"
          RAW_CHANNEL="${INPUT_CHANNEL:-android}"
          SAFE_CHANNEL=$(printf '%s' "$RAW_CHANNEL" | tr -cd 'a-z0-9-')
          SAFE_CHANNEL="${SAFE_CHANNEL:-android}"

          BUTLER_VERSION="15.32.0"
          BUTLER_SHA256="2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5"
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum -c -
          unzip -q butler.zip -d "${RUNNER_TEMP}/butler_bin"
          chmod +x "${RUNNER_TEMP}/butler_bin/butler"
          "${RUNNER_TEMP}/butler_bin/butler" push "$APK_PATH" "durcheins/apkup:${SAFE_CHANNEL}" --userversion "$SAFE_VERSION"
          rm -f butler.zip
