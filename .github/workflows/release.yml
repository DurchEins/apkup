name: Build & Publish Release
run-name: "Release ${{ inputs.tag_name != '' && inputs.tag_name || 'Artifact-Build' }}"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional Git tag to publish as a GitHub Release (leave empty to build artifact only)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release (keep false for regular stable releases)'
        required: false
        default: false
        type: boolean
      itch_channel:
        description: 'itch.io Butler channel (android for stable, android-beta for pre-releases)'
        required: false
        default: 'android'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stage Release Keystore (Fail-Closed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Refusing to build debug-signed release APK."
            exit 1
          fi
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Run Lint, Unit Tests and Assemble Signed Release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease testDebugUnitTest assembleRelease --stacktrace

      - name: Shred Staged Keystore
        if: always()
        run: |
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          if [ -f "$KS_PATH" ]; then
            shred -u "$KS_PATH" 2>/dev/null || rm -f "$KS_PATH"
          fi

      - name: Verify APK Signature & Prepare Release Assets
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          mkdir -p release_assets
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Expected signed APK not found at $APK_FILE"
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose "$APK_FILE"
          fi

          RAW_LABEL="${INPUT_TAG:-run-${GITHUB_RUN_NUMBER}}"
          SAFE_LABEL=$(printf '%s' "$RAW_LABEL" | tr -cd 'A-Za-z0-9._-')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | tail -n 1 || true)
          if [ -n "$VERSION_CODE" ] && [ -n "$INPUT_TAG" ]; then
            APK_FILENAME="ApkUp-${SAFE_LABEL}-${VERSION_CODE}.apk"
          else
            APK_FILENAME="ApkUp-${SAFE_LABEL}.apk"
          fi
          TARGET_APK="release_assets/${APK_FILENAME}"
          cp "$APK_FILE" "$TARGET_APK"
          (cd release_assets && sha256sum "$(basename "$TARGET_APK")" > "$(basename "$TARGET_APK").sha256")
          APK_SHA256=$(awk '{print $1}' "${TARGET_APK}.sha256")

          CHANGELOG_MD=$(ls -v app/src/main/assets/changelog/*_en.md 2>/dev/null | tail -n 1)
          CHANGELOG_BODY=""
          if [ -n "$CHANGELOG_MD" ] && [ -f "$CHANGELOG_MD" ]; then
            CHANGELOG_BODY=$(awk '
              /^### / {
                if (found) exit
                found=1
                next
              }
              found {
                if (/^> \[Banner\]/ || /^$/) next
                if (sub(/^- \*\*/, "- **")) {
                  line = $0
                  sub(/\*\* /, ":** ", line)
                  print line
                } else {
                  print
                }
              }
            ' "$CHANGELOG_MD")
          fi
          if [ -z "$CHANGELOG_BODY" ]; then
            CHANGELOG_FILE=$(ls -v fastlane/metadata/android/en-US/changelogs/*.txt 2>/dev/null | tail -n 1)
            if [ -n "$CHANGELOG_FILE" ] && [ -f "$CHANGELOG_FILE" ]; then
              CHANGELOG_BODY=$(cat "$CHANGELOG_FILE")
            else
              CHANGELOG_BODY="ApkUp Release ${SAFE_LABEL}"
            fi
          fi

          CLEAN_VER="${SAFE_LABEL#v}"
          BADGE_LABEL="Feature_Update"
          BADGE_COLOR="A855F7"
          if printf '%s' "$CLEAN_VER" | grep -qE '^[0-9]+\.[0-9]+\.[1-9][0-9]*'; then
            BADGE_LABEL="Patch_%26_Fix"
            BADGE_COLOR="38BDF8"
          elif printf '%s' "$CLEAN_VER" | grep -qE '^[0-9]+\.0\.0'; then
            BADGE_LABEL="Major_Update"
            BADGE_COLOR="F59E0B"
          fi

          cat <<EOF > release_assets/RELEASE_NOTES.md
          <div align="center">

          ## What's new in ${SAFE_LABEL}${VERSION_CODE:+ (Build ${VERSION_CODE})}
          ![](https://img.shields.io/badge/Release-${BADGE_LABEL}-${BADGE_COLOR}?style=flat&labelColor=161B22) ${VERSION_CODE:+![](https://img.shields.io/badge/Build-${VERSION_CODE}-38BDF8?style=flat&labelColor=161B22)}

          </div>

          ${CHANGELOG_BODY}

          ---

          ### 💬 Feedback, Bugs & Ideas
          Found a bug, have an idea, or encountered an issue? Please don't hesitate to open an **[Issue](https://github.com/DurchEins/apkup/issues)** on GitHub or share your feedback so we can make ApkUp even better!

          ---

          <details>
          <summary><b>📦 Installation & In-App Update Instructions</b></summary>
          <br>

          Download the attached **_[${APK_FILENAME}](https://github.com/DurchEins/apkup/releases/download/${SAFE_LABEL}/${APK_FILENAME})_** below or update directly via the in-app updater (<kbd>Settings</kbd> ➔ <kbd>About</kbd> ➔ <kbd>Check Update</kbd>).

          - **Alternative Mirrors:**<br>
            <a href="https://zapstore.dev/apps/com.apkup"><img src="https://img.shields.io/badge/Zapstore-Available-7C3AED?style=flat&logo=lightning&logoColor=white" alt="Available on Zapstore" /></a> <a href="https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22com.apkup%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2FDurchEins%2Fapkup%22%2C%22author%22%3A%22DurchEins%22%2C%22name%22%3A%22ApkUp%22%7D"><img src="https://img.shields.io/badge/Obtainium-1--Click%20Import-6750A4?style=flat&logo=data%3Aimage%2Fsvg%2Bxml%3Bbase64%2CPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjY5IDk3IDY1IDU4IiBmaWxsPSJ3aGl0ZSI%%3D%3D" alt="1-Click Import into Obtainium" /></a> <a href="https://gitlab.com/DurchEins1/apkup/-/releases"><img src="https://img.shields.io/badge/GitLab-Releases-FC6D26?style=flat&logo=gitlab&logoColor=white" alt="Download from GitLab Releases" /></a> <a href="https://apkpure.com/apkup/com.apkup"><img src="https://img.shields.io/badge/APKPure-Available-24C270?style=flat&logo=data%3Aimage%2Fsvg%2Bxml%3Bbase64%2CPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik01LjIgMi40QzQuMiAxLjggMyAyLjUgMyAzLjd2MTYuNmMwIDEuMiAxLjIgMS45IDIuMiAxLjNsMTQuNi04LjNjMS0uNiAxLTIgMC0yLjZMNS4yIDIuNHptNC45IDUuNWw0LjkgNC4xLTQuOSA0LjFWNy45eiIvPjwvc3ZnPg%3D%3D" alt="Available on APKPure" /></a> <a href="https://alternativeto.net/software/apkup/about/"><img src="https://img.shields.io/badge/AlternativeTo-Listed-0066CC?style=flat&logo=alternativeto&logoColor=white" alt="Listed on AlternativeTo" /></a> <a href="https://durcheins.itch.io/apkup"><img src="https://img.shields.io/badge/itch.io-Available-FA5C5C?style=flat&logo=itchdotio&logoColor=white" alt="Available on itch.io" /></a> <a href="https://appteka.store/app/c0cr341070"><img src="https://img.shields.io/badge/Appteka-Available-0EA5E9?style=flat&logo=data%3Aimage%2Fsvg%2Bxml%3Bbase64%2CPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIH