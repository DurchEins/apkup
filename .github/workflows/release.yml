name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore (if Secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            cp release.keystore app/release.keystore
            echo "keystore.file=release.keystore" >> local.properties
            echo "keystore.password=$KEYSTORE_PASSWORD" >> local.properties
            echo "keystore.keyalias=$KEY_ALIAS" >> local.properties
            echo "keystore.keypassword=$KEY_PASSWORD" >> local.properties
            echo "Keystore successfully configured."
          else
            echo "No KEYSTORE_BASE64 secret provided. Gradle will fall back to debug signing."
          fi

      - name: Run Unit Tests and Assemble Release
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_assets
          # Find generated release APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            TAG_OR_RUN="${GITHUB_REF_NAME:-run-${GITHUB_RUN_NUMBER}}"
            TARGET_APK="release_assets/ApkUp-${TAG_OR_RUN}.apk"
            cp "$APK_FILE" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK file found in app/build/outputs/apk/release"
            exit 1
          fi

      - name: Generate Changelog Notes
        id: changelog
        run: |
          CHANGELOG_FILE=$(ls -v fastlane/metadata/android/en-US/changelogs/*.txt 2>/dev/null | tail -n 1)
          if [ -n "$CHANGELOG_FILE" ] && [ -f "$CHANGELOG_FILE" ]; then
            echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
            cat "$CHANGELOG_FILE" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "RELEASE_NOTES=ApkUp Release" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*.apk
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: true
